name: Build, test and release
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Publish this version from main after all checks (for example v0.14.1)'
        required: false
        default: ''
        type: string
permissions:
  contents: read
jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.0'
          cache: npm
      - name: Verify release version
        if: (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || inputs.release_tag != ''
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: node scripts/validate-release.mjs
      - run: npm ci
      - run: npm run build
      - run: npm test
        timeout-minutes: 3
      - run: npm run test:integration
      - run: npm run test:features
      - name: Test concurrent sessions and settings with real Pi
        run: node --import tsx scripts/test-concurrency-settings.ts
      - name: Package Windows and macOS acceptance builds
        if: matrix.os != 'ubuntu-latest'
        env:
          # mac.identity is '-' (ad-hoc); PR acceptance must sign before integrity verification.
          CSC_FOR_PULL_REQUEST: 'true'
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: node scripts/package.mjs --dir
      - name: Measure ten session switches in the packaged app
        if: matrix.os != 'ubuntu-latest'
        run: npm run test:session-ui -- --packaged
      - name: Install Linux desktop test dependencies
        if: matrix.os == 'ubuntu-latest'
        run: npx playwright install-deps chromium
      - name: Install Linux appearance test tools
        if: matrix.os == 'ubuntu-latest'
        run: |
          npx playwright install chromium --only-shell
          sudo apt-get install -y openbox
      - name: Test native desktop appearance and confirmation lifecycle
        if: matrix.os != 'ubuntu-latest'
        run: npm run test:theme-ui
      - name: Test isolated Pi settings races
        if: matrix.os == 'ubuntu-latest'
        run: npm run test:pi-settings-ui
      - name: Capture updated README appearance previews
        if: matrix.os == 'ubuntu-latest'
        run: npm run screenshots -- output/playwright/readme
      - name: Test desktop layout and interactions
        if: matrix.os == 'ubuntu-latest'
        run: xvfb-run -a -s "-screen 0 1920x1080x24" npm run test:ui
      - name: Test chat workflows
        if: matrix.os == 'ubuntu-latest'
        run: xvfb-run -a -s "-screen 0 1920x1080x24" npm run test:chat-ui
      - name: Test feature panels and approvals
        if: matrix.os == 'ubuntu-latest'
        run: xvfb-run -a -s "-screen 0 1920x1080x24" npm run test:features-ui
      - name: Test native Linux appearance and confirmation lifecycle
        if: matrix.os == 'ubuntu-latest'
        env:
          PI_DESKTOP_REQUIRE_WINDOW_MANAGER: '1'
        run: xvfb-run -a -s "-screen 0 1920x1080x24" sh -c 'openbox >/tmp/pi-openbox.log 2>&1 & npm run test:theme-ui'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: acceptance-${{ matrix.os }}
          path: |
            test-results/
            output/playwright/
          if-no-files-found: ignore

  update-roundtrip:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.0'
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Install Linux desktop test dependencies
        if: matrix.os == 'ubuntu-latest'
        run: npx playwright install-deps chromium
      - name: Test Windows installer updates
        if: matrix.os == 'windows-latest'
        run: npm run test:update
      - name: Test Linux AppImage updates
        if: matrix.os == 'ubuntu-latest'
        run: xvfb-run -a -s "-screen 0 1920x1080x24" npm run test:update
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: update-roundtrip-${{ matrix.os }}
          path: test-results/
          if-no-files-found: ignore

  package:
    needs: [build-and-test, update-roundtrip]
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.0'
          cache: npm
      - run: npm ci
      - run: npm run package
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: pi-desktop-${{ matrix.os }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.zip
            release/*.AppImage
            release/*.deb
            release/latest*.yml
            release/*.blockmap
          if-no-files-found: error
          compression-level: 0

  release:
    needs: package
    if: (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '' && github.ref == 'refs/heads/main')
    concurrency:
      group: release-${{ inputs.release_tag || github.ref_name }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.0'
          cache: npm
      - name: Verify release context
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: node scripts/validate-release.mjs
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@v4
        with:
          pattern: pi-desktop-*
          merge-multiple: true
          path: release-assets
      - name: Verify updater metadata and download hashes
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: node scripts/verify-update-metadata.mjs release-assets
      - name: Generate release checksums
        run: (cd release-assets && sha256sum * > SHA256SUMS.txt)
      - name: Create the new manual release tag
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          # Creating a ref is atomic and fails if the tag already exists. Never update it.
          gh api --method POST "repos/$GH_REPO/git/refs" \
            -f "ref=refs/tags/$RELEASE_TAG" -f "sha=$GITHUB_SHA"
          test "$(git ls-remote origin "refs/tags/$RELEASE_TAG" | cut -f1)" = "$GITHUB_SHA"
      - name: Publish installers and checksums
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          set -euo pipefail
          gh release create "$RELEASE_TAG" release-assets/* \
            --verify-tag \
            --title "Pi Desktop $RELEASE_TAG" \
            --notes-file "docs/releases/$RELEASE_TAG.md"
